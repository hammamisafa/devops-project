name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: python -m pytest -v

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Bandit
        run: pip install bandit

      - name: Scanner le code (sévérité moyenne et plus)
        run: |
          bandit -r app -ll -f txt | tee bandit-report.txt
          exit ${PIPESTATUS[0]}

      - name: Sauvegarder le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt

  docker-build:
    name: Build et scan de l'image Docker
    runs-on: ubuntu-latest
    needs: [test, sast]
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t devops-api:ci .

      - name: Scanner l'image avec Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 \
            devops-api:ci | tee trivy-report.txt

      - name: Sauvegarder le rapport Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

      - name: Tester le conteneur (/health)
        run: |
          docker run -d -p 8000:8000 --name api devops-api:ci
          sleep 5
          curl --fail http://localhost:8000/health

  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Démarrer l'API
        run: |
          docker build -t devops-api:ci .
          docker run -d -p 8000:8000 --name api devops-api:ci
          sleep 5
          curl --fail http://localhost:8000/health

      - name: Scanner l'API avec OWASP ZAP
        run: |
          mkdir zap-out
          chmod 777 zap-out
          docker run --rm --network host \
            -v "$(pwd)/zap-out:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-api-scan.py \
            -t http://localhost:8000/openapi.json -f openapi \
            -r zap-report.html -I

      - name: Sauvegarder le rapport ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-out/zap-report.html

  publish:
    name: Publication sur Docker Hub
    runs-on: ubuntu-latest
    needs: [test, sast, docker-build, dast]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Construire et publier l'image
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/devops-api"
          SHORT_SHA="${GITHUB_SHA::7}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:$SHORT_SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHORT_SHA"