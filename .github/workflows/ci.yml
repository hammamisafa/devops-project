name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests
        run: python -m pytest -v
    dast:
    runs-on: ubuntu-latest
    needs: build-test        # remplace par le nom réel de ton job de tests
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t devops-api:latest .

      - name: Run API
        run: |
          docker run -d -p 8000:8000 --name api devops-api:latest
          sleep 5
          curl --fail http://localhost:8000/health

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:8000"
          allow_issue_writing: false
          fail_action: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html

  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Bandit
        run: pip install bandit

      - name: Scanner le code (sévérité moyenne et plus)
        run: |
          bandit -r app -ll -f txt | tee bandit-report.txt
          exit ${PIPESTATUS[0]}

      - name: Sauvegarder le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.txt

  docker-build:
    name: Build et scan de l'image Docker
    runs-on: ubuntu-latest
    needs: [test, sast]
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build -t devops-api:ci .

      - name: Scanner l'image avec Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 \
            devops-api:ci | tee trivy-report.txt

      - name: Sauvegarder le rapport Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

      - name: Tester le conteneur (/health)
        run: |
          docker run -d -p 8000:8000 --name api devops-api:ci
          sleep 5
          curl --fail http://localhost:8000/health